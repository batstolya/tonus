# CI-гейт деплоя: авто-деплой Vercel выключен (vercel.json), прод обновляется
# только job'ом deploy после зелёных тестов — через Deploy Hook
# (secret VERCEL_DEPLOY_HOOK, создаётся в Vercel → Settings → Git → Deploy Hooks).
name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # full history so lint:diff can compute `git diff <base>...HEAD`
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Script unit tests
        run: npm run test:scripts

      - name: Security inventory drift guard
        run: npm run security:inventory:check

      - name: README validation
        run: npm run test:readme

      - name: Build (tsc + vite)
        run: npm run build
        env:
          # dummy: сборке значения не нужны, прод-ключи живут в Vercel
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key

      - name: E2E smoke (playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # Zero-tolerance lint: the B4 burn-down emptied the debt, so any error or
      # warning fails CI outright (the .lint-ceiling ratchet is retired).
      - name: Lint
        run: npm run lint

      # PR-гейт: любая новая lint-ошибка на изменённых строках роняет CI,
      # даже если суммарный потолок не превышен.
      - name: New lint errors on changed lines
        if: github.event_name == 'pull_request'
        run: npm run lint:diff

      # Zero-tolerance deno type check of shipped edge-function code; *.test.ts
      # run under vitest and are excluded (the ceiling ratchet is retired).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check (zero errors)
        run: npm run check:functions

      # Дрифт-гард DB-типов: если миграция залита без `npm run gen:types`,
      # database.types.ts устареет. Скрипт gracefully пропускает проверку, пока
      # секрет SUPABASE_ACCESS_TOKEN не задан (без токена CLI не достучится до
      # проекта → exit 0 с warning), поэтому шаг безопасен и до установки секрета.
      - name: DB types drift guard
        run: npm run gen:types:check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "deploy hook triggered"
